<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="FFCC Fantasy Football Command Center">
  <defs>
    <linearGradient id="bg" x1="64" y1="48" x2="448" y2="464" gradientUnits="userSpaceOnUse">
      <stop stop-color="#081522"/>
      <stop offset="1" stop-color="#030810"/>
    </linearGradient>
    <linearGradient id="ring" x1="112" y1="96" x2="408" y2="420" gradientUnits="userSpaceOnUse">
      <stop stop-color="#43D7FF"/>
      <stop offset=".52" stop-color="#34E7BD"/>
      <stop offset="1" stop-color="#8467FF"/>
    </linearGradient>
    <linearGradient id="ball" x1="172" y1="130" x2="349" y2="335" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F8FBFF"/>
      <stop offset="1" stop-color="#C8D6E8"/>
    </linearGradient>
    <linearGradient id="word" x1="128" y1="0" x2="390" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#27E5FF"/>
      <stop offset=".45" stop-color="#5AA8FF"/>
      <stop offset="1" stop-color="#D94CFF"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow" x="-30%" y="-50%" width="160%" height="200%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect x="28" y="28" width="456" height="456" rx="92" fill="none" stroke="#17314A" stroke-width="4"/>

  <circle cx="256" cy="226" r="145" fill="none" stroke="#10263A" stroke-width="18"/>
  <circle cx="256" cy="226" r="145" fill="none" stroke="url(#ring)" stroke-width="11" stroke-linecap="round" stroke-dasharray="395 520" transform="rotate(-30 256 226)" filter="url(#glow)" opacity=".95"/>
  <path d="M256 52v50M256 350v40M74 226h48M390 226h48" stroke="#43D7FF" stroke-width="10" stroke-linecap="round" opacity=".9"/>

  <g transform="translate(0 -18) rotate(-8 260 230)">
    <path d="M174 149c52-37 112-41 164-9 27 17 45 42 53 72-19 77-69 132-149 164-34-5-63-20-87-45-24-24-39-53-44-87 11-40 32-72 63-95Z" fill="#0B1725" stroke="#21415A" stroke-width="8"/>
    <path d="M168 298c21-68 70-120 148-157 34 3 61 17 81 39-21 72-70 127-148 165-35-3-62-19-81-47Z" fill="url(#ball)"/>
    <path d="M229 216l59 56M246 201l12 13M263 190l12 13M280 181l12 13M297 173l12 13" stroke="#071018" stroke-width="10" stroke-linecap="round"/>
