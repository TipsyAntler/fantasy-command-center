  <path d="M104 348h304l27 24v73l-27 23H104l-27-23v-73l27-24Z" fill="#07111E" stroke="url(#word)" stroke-width="5" filter="url(#softGlow)"/>
  <path d="M113 361h286" stroke="#172A41" stroke-width="2" opacity=".9"/>
  <text x="256" y="425" text-anchor="middle" fill="url(#word)" font-family="Arial Black, Arial, sans-serif" font-size="74" font-style="italic" font-weight="900" letter-spacing="5">FFCC</text>
  <path d="M180 449h80M278 449h54" stroke="url(#word)" stroke-width="4" stroke-linecap="round" opacity=".9"/>
